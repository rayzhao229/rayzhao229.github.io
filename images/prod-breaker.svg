<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="小型断路器（MCB）">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e8edf4"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f2f5f9"/>
      <stop offset="100%" stop-color="#dfe5ec"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cfd8e3"/>
      <stop offset="100%" stop-color="#aab6c6"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9aa6b6"/>
      <stop offset="50%" stop-color="#c3ccd8"/>
      <stop offset="100%" stop-color="#8d99a9"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- 背板网格 -->
  <g stroke="#cbd5e1" stroke-opacity=".45" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="600"/><line x1="80" y1="0" x2="80" y2="600"/><line x1="120" y1="0" x2="120" y2="600"/><line x1="160" y1="0" x2="160" y2="600"/><line x1="200" y1="0" x2="200" y2="600"/><line x1="240" y1="0" x2="240" y2="600"/><line x1="280" y1="0" x2="280" y2="600"/><line x1="320" y1="0" x2="320" y2="600"/><line x1="360" y1="0" x2="360" y2="600"/><line x1="400" y1="0" x2="400" y2="600"/><line x1="440" y1="0" x2="440" y2="600"/><line x1="480" y1="0" x2="480" y2="600"/><line x1="520" y1="0" x2="520" y2="600"/><line x1="560" y1="0" x2="560" y2="600"/><line x1="600" y1="0" x2="600" y2="600"/><line x1="640" y1="0" x2="640" y2="600"/><line x1="680" y1="0" x2="680" y2="600"/><line x1="720" y1="0" x2="720" y2="600"/><line x1="760" y1="0" x2="760" y2="600"/>
    <line x1="0" y1="40" x2="800" y2="40"/><line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="120" x2="800" y2="120"/><line x1="0" y1="160" x2="800" y2="160"/><line x1="0" y1="200" x2="800" y2="200"/><line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="280" x2="800" y2="280"/><line x1="0" y1="320" x2="800" y2="320"/><line x1="0" y1="360" x2="800" y2="360"/><line x1="0" y1="400" x2="800" y2="400"/><line x1="0" y1="440" x2="800" y2="440"/><line x1="0" y1="480" x2="800" y2="480"/><line x1="0" y1="520" x2="800" y2="520"/><line x1="0" y1="560" x2="800" y2="560"/>
  </g>

  <!-- DIN 导轨 -->
  <g>
    <rect x="150" y="452" width="500" height="26" rx="3" fill="url(#rail)"/>
    <rect x="150" y="452" width="500" height="7" fill="#dbe2ea" fill-opacity=".8"/>
    <g stroke="#6b7787" stroke-opacity=".5" stroke-width="3">
      <line x1="200" y1="452" x2="200" y2="478"/>
      <line x1="600" y1="452" x2="600" y2="478"/>
    </g>
  </g>

  <!-- 断路器本体（三极联动） -->
  <g>
    <!-- 背面卡扣 -->
    <rect x="266" y="176" width="268" height="16" rx="4" fill="#8d99a9"/>
    <!-- 主体 -->
    <rect x="250" y="186" width="300" height="272" rx="10" fill="url(#body)" stroke="#b6c1cf" stroke-width="2"/>
    <!-- 侧面厚度 -->
    <path d="M550 186 q22 8 22 30 v212 q0 22 -22 30 z" fill="url(#side)"/>
    <!-- 三极分缝 -->
    <g stroke="#c3ccd8" stroke-width="2">
      <line x1="350" y1="196" x2="350" y2="448"/>
      <line x1="450" y1="196" x2="450" y2="448"/>
    </g>
    <!-- 上下接线端子孔（每极两个） -->
    <g>
      <rect x="288" y="200" width="26" height="22" rx="4" fill="#c9d3df" stroke="#a9b5c4" stroke-width="1.5"/><path d="M296 208 h10 M301 203 v10" stroke="#8d99a9" stroke-width="2" stroke-linecap="round"/><rect x="288" y="418" width="26" height="22" rx="4" fill="#c9d3df" stroke="#a9b5c4" stroke-width="1.5"/><path d="M296 426 h10 M301 421 v10" stroke="#8d99a9" stroke-width="2" stroke-linecap="round"/><rect x="388" y="200" width="26" height="22" rx="4" fill="#c9d3df" stroke="#a9b5c4" stroke-width="1.5"/><path d="M396 208 h10 M401 203 v10" stroke="#8d99a9" stroke-width="2" stroke-linecap="round"/><rect x="388" y="418" width="26" height="22" rx="4" fill="#c9d3df" stroke="#a9b5c4" stroke-width="1.5"/><path d="M396 426 h10 M401 421 v10" stroke="#8d99a9" stroke-width="2" stroke-linecap="round"/><rect x="488" y="200" width="26" height="22" rx="4" fill="#c9d3df" stroke="#a9b5c4" stroke-width="1.5"/><path d="M496 208 h10 M501 203 v10" stroke="#8d99a9" stroke-width="2" stroke-linecap="round"/><rect x="488" y="418" width="26" height="22" rx="4" fill="#c9d3df" stroke="#a9b5c4" stroke-width="1.5"/><path d="M496 426 h10 M501 421 v10" stroke="#8d99a9" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- 联动操作手柄（中间黑色连杆 + ON 指示） -->
    <rect x="278" y="286" width="244" height="34" rx="7" fill="#2b3440"/>
    <rect x="278" y="286" width="244" height="10" rx="5" fill="#48545f" fill-opacity=".8"/>
    <g fill="#e8edf4">
      <rect x="360" y="295" width="30" height="16" rx="4"/>
      <rect x="410" y="295" width="30" height="16" rx="4"/>
    </g>
    <!-- 手柄右侧红色标记 -->
    <rect x="492" y="294" width="20" height="18" rx="4" fill="#c0392b"/>
    <!-- 铭牌区 -->
    <rect x="278" y="240" width="128" height="34" rx="5" fill="#ffffff" stroke="#c9d3df" stroke-width="1.5"/>
    <text x="342" y="263" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#334155" letter-spacing="2">MCB</text>
    <!-- 极数指示点 -->
    <g fill="#94a3b8">
      <circle cx="305" cy="352" r="6"/><circle cx="405" cy="352" r="6"/><circle cx="505" cy="352" r="6"/>
    </g>
  </g>

  <!-- 标注：示意图 -->
  <g>
    <rect x="560" y="500" width="212" height="46" rx="8" fill="#0b3b60" fill-opacity=".08"/>
    <text x="666" y="520" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#475569">示意图 · 型号以报价单为准</text>
    <text x="666" y="539" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#94a3b8" letter-spacing="1">MINGHUA RUIYI</text>
  </g>
</svg>